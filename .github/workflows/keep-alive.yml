name: Render Keep-Alive Cronjob

on:
  schedule:
    # Runs every 14 minutes to prevent the Render instance from sleeping
    - cron: '*/14 * * * *'
  # Allows you to trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch: 

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Keep-Alive Script
        run: node keep-alive.js
